[package]
name = "home-feeling"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "home-feeling-app"
path = "src/main.rs"

[dependencies]
bones-kernel = { path = "../../vendor/bones/crates/bones-kernel", default-features = false, features = ["presentation"] }
# bones links SDL3; building it from source statically keeps the app one file.
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "unsafe_textures"] }
bones-consent = { path = "../../crates/bones-consent" }
bones-module-lua = { path = "../../crates/bones-module-lua" }
home-feeling-desktop = { path = "../../crates/home-feeling-desktop" }
dirs = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"

[dev-dependencies]
tempfile = "3"
