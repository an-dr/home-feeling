[package]
name = "bones-module-lua"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Hosts Lua guests on the bones bus with the contract of bones' WASM extensions"

[dependencies]
bones-kernel-infra = { path = "../../vendor/bones/crates/bones-kernel/bones-kernel-infra", default-features = false }
bones-messages = { path = "../../vendor/bones/crates/bones-messages" }
mlua = { version = "0.10", features = ["luau", "send", "serialize"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
