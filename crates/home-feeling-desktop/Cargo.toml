[package]
name = "home-feeling-desktop"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Native bones module giving the bus control of windows, monitors, hotkeys, and overlays"

[dependencies]
bones-kernel-infra = { path = "../../vendor/bones/crates/bones-kernel/bones-kernel-infra", default-features = false }
bones-messages = { path = "../../vendor/bones/crates/bones-messages" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
